<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline · Life OS</title>
  <style>
    :root { --bg: #fff8ec; --ink: #3b1d12; --soft: #7a5a48; }
    @media (prefers-color-scheme: dark) { :root { --bg: #1b110c; --ink: #fbefdd; --soft: #c4a58c; } }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; text-align: center; padding: 24px;
           background: var(--bg); color: var(--ink); font-family: system-ui, sans-serif; }
    h1 { font-size: 1.6rem; margin: 12px 0 6px; } p { color: var(--soft); max-width: 28ch; margin: 0 auto; }
  </style>
</head>
<body>
  <main><div style="font-size:3rem">🪔</div><h1>You're offline</h1><p>Your meals are safe. Reconnect and we'll pick up where you left off.</p></main>
</body>
</html>
